<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave BFEx a Google Review</title>
<meta name="robots" content="noindex">
<!--
  ================= BFEx review redirect =================
  This page forwards to the live Google review link.
  >>> WHEN GBP IS LIVE: replace GOOGLE_REVIEW_URL below with the real
      short link from your Google Business Profile ("Ask for reviews" ->
      copy link, format: https://g.page/r/XXXXXXXXXXXX/review). That's the
      ONLY change needed — the QR code and every printed card already point
      here, so they never need reprinting.
  ======================================================= -->
<style>
  :root{--green:#1b3428;--gold:#ffc700;--cream:#f7f6f0;--ink:#111}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--green);color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{max-width:460px}
  h1{font-size:1.6rem;margin:0 0 .5rem}
  p{color:#c9d3cc;line-height:1.5;margin:.4rem 0 1.4rem}
  .btn{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;text-decoration:none;
       padding:16px 28px;border-radius:10px;font-size:1.1rem}
  .btn:active{transform:translateY(1px)}
  .stars{font-size:2rem;color:var(--gold);letter-spacing:4px;margin-bottom:14px}
  small{display:block;margin-top:22px;color:#8ea295}
</style>
</head>
<body>
  <div class="card">
    <div class="stars">★★★★★</div>
    <h1>Thanks for choosing BFEx</h1>
    <p>We'd really appreciate a quick Google review — it helps other locals find us. Tap below to leave one.</p>
    <a class="btn" id="reviewBtn" href="#">Leave a Google review →</a>
    <small>Bonville Forestry &amp; Excavations · 0448 482 321</small>
  </div>
<script>
  // >>> Swap this for your real g.page review link once GBP is verified <<<
  var GOOGLE_REVIEW_URL = ""; // e.g. "https://g.page/r/XXXXXXXXXXXX/review"
  var btn = document.getElementById('reviewBtn');
  if (GOOGLE_REVIEW_URL) {
    btn.href = GOOGLE_REVIEW_URL;
    // auto-forward after a beat so the QR feels instant
    setTimeout(function(){ window.location.replace(GOOGLE_REVIEW_URL); }, 900);
  } else {
    btn.textContent = "Google review link coming soon";
    btn.style.pointerEvents = "none";
    btn.style.opacity = ".7";
  }
</script>
</body>
</html>
